<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Bouwwerk en vouwwerk">
  <title>Bouw-vouw · nabouwen en vouwlijn</title>
  <desc>G3-MKU-E03: soft-3D blokkentoren (1+3) + vouwblad met vouwlijn. Reuse: /manipulatieven/bouwwerk.html</desc>
  <defs>
    <filter id="b" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1B2A4A" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="topTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4EC4B6"/><stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>
    <linearGradient id="sideNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3F66"/><stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="#F7F4EF"/>
  <text x="28" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Nabouwen &amp; vouwen</text>
  <text x="28" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Bouwsel nabootsen · vouwlijn volgen</text>

  <text x="180" y="90" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Bouwsel</text>
  <!-- isometric-ish blocks: top row 1, bottom 3 — matches bank example count 4 -->
  <g filter="url(#b)" transform="translate(70,120)">
    <!-- bottom row -->
    <g transform="translate(0,90)">
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#topTeal)"/>
      <polygon points="0,20 40,40 40,70 0,50" fill="url(#sideNavy)"/>
      <polygon points="40,40 80,20 80,50 40,70" fill="#21867A"/>
    </g>
    <g transform="translate(70,90)">
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#topTeal)"/>
      <polygon points="0,20 40,40 40,70 0,50" fill="url(#sideNavy)"/>
      <polygon points="40,40 80,20 80,50 40,70" fill="#21867A"/>
    </g>
    <g transform="translate(140,90)">
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#topTeal)"/>
      <polygon points="0,20 40,40 40,70 0,50" fill="url(#sideNavy)"/>
      <polygon points="40,40 80,20 80,50 40,70" fill="#21867A"/>
    </g>
    <!-- top block centered -->
    <g transform="translate(70,30)">
      <polygon points="40,0 80,20 40,40 0,20" fill="url(#topTeal)"/>
      <polygon points="0,20 40,40 40,70 0,50" fill="url(#sideNavy)"/>
      <polygon points="40,40 80,20 80,50 40,70" fill="#21867A"/>
      <ellipse cx="40" cy="16" rx="14" ry="6" fill="#FFFFFF" opacity="0.28"/>
    </g>
  </g>
  <text x="180" y="330" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12">voorbeeld · 4 blokken</text>

  <text x="520" y="90" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Vouwwerk</text>
  <g filter="url(#b)" transform="translate(400,110)">
    <rect width="220" height="170" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
    <rect x="14" y="14" width="96" height="142" rx="8" fill="#E6F5F3"/>
    <line x1="110" y1="14" x2="110" y2="156" stroke="#2A9D8F" stroke-width="3.5" stroke-dasharray="9 6" stroke-linecap="round"/>
    <path d="M72 88 Q110 58 148 88" fill="none" stroke="#21867A" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="148,88 138,82 140,96" fill="#21867A"/>
    <text x="110" y="198" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">vouwlijn</text>
  </g>
</svg>
