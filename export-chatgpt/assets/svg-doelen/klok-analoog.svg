<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Analoge klok, hele uren">
  <title>Analoge klok (hele uren)</title>
  <desc>Schone analoge klok in cream/navy/teal. Standaardstand 3 uur. Voor settable demo: zie klok-analoog.html.</desc>
  <!-- face -->
  <circle cx="120" cy="120" r="108" fill="#F7F4EF" stroke="#1B2A4A" stroke-width="4"/>
  <circle cx="120" cy="120" r="100" fill="#FFFFFF" stroke="#EDE8DF" stroke-width="2"/>
  <!-- hour ticks -->
  <g stroke="#1B2A4A" stroke-linecap="round">
    <line x1="120" y1="28" x2="120" y2="40" stroke-width="3"/>
    <line x1="162" y1="34.5" x2="157" y2="45.2" stroke-width="2.5"/>
    <line x1="193.5" y1="58" x2="184.8" y2="66" stroke-width="2.5"/>
    <line x1="212" y1="120" x2="200" y2="120" stroke-width="3"/>
    <line x1="193.5" y1="182" x2="184.8" y2="174" stroke-width="2.5"/>
    <line x1="162" y1="205.5" x2="157" y2="194.8" stroke-width="2.5"/>
    <line x1="120" y1="212" x2="120" y2="200" stroke-width="3"/>
    <line x1="78" y1="205.5" x2="83" y2="194.8" stroke-width="2.5"/>
    <line x1="46.5" y1="182" x2="55.2" y2="174" stroke-width="2.5"/>
    <line x1="28" y1="120" x2="40" y2="120" stroke-width="3"/>
    <line x1="46.5" y1="58" x2="55.2" y2="66" stroke-width="2.5"/>
    <line x1="78" y1="34.5" x2="83" y2="45.2" stroke-width="2.5"/>
  </g>
  <!-- numerals 12,3,6,9 -->
  <g fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    <text x="120" y="52">12</text>
    <text x="188" y="128">3</text>
    <text x="120" y="204">6</text>
    <text x="52" y="128">9</text>
  </g>
  <!-- minute hand on 12 (hele uur) -->
  <line x1="120" y1="120" x2="120" y2="38" stroke="#2A9D8F" stroke-width="4" stroke-linecap="round"/>
  <!-- hour hand on 3 (default 3:00) — readable length -->
  <line x1="120" y1="120" x2="178" y2="120" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="7" fill="#1B2A4A"/>
  <circle cx="120" cy="120" r="3" fill="#F7F4EF"/>
</svg>
