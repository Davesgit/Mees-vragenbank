<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Figuurpatroon voortzetten">
  <title>Patronen-reeks · figuurpatroon voortzetten</title>
  <desc>G3-VBN-E03: soft-3D reeks cirkel–driehoek met open slot. Geen antwoordtekst in beeld.</desc>
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1B2A4A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="clayTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3CB5A6"/><stop offset="100%" stop-color="#21867A"/>
    </linearGradient>
    <linearGradient id="clayNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3F66"/><stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <rect width="720" height="250" fill="#F7F4EF"/>
  <text x="24" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Patroon voortzetten</text>
  <text x="24" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Welke figuur komt hierna?</text>
  <g transform="translate(24,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#FFFFFF"/>
    <circle cx="50" cy="54" r="30" fill="url(#clayTeal)"/>
    <ellipse cx="40" cy="42" rx="11" ry="7" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g transform="translate(140,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#FFFFFF"/>
    <polygon points="50,24 80,80 20,80" fill="url(#clayNavy)"/>
    <polygon points="50,36 62,62 38,62" fill="#FFFFFF" opacity="0.22"/>
  </g>
  <g transform="translate(256,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#FFFFFF"/>
    <circle cx="50" cy="54" r="30" fill="url(#clayTeal)"/>
    <ellipse cx="40" cy="42" rx="11" ry="7" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g transform="translate(372,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#FFFFFF"/>
    <polygon points="50,24 80,80 20,80" fill="url(#clayNavy)"/>
    <polygon points="50,36 62,62 38,62" fill="#FFFFFF" opacity="0.22"/>
  </g>
  <g transform="translate(488,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#FFFFFF"/>
    <circle cx="50" cy="54" r="30" fill="url(#clayTeal)"/>
    <ellipse cx="40" cy="42" rx="11" ry="7" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g transform="translate(604,80)" filter="url(#soft)">
    <rect width="100" height="100" rx="18" fill="#E6F5F3" stroke="#2A9D8F" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="50" y="62" text-anchor="middle" fill="#21867A" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700">?</text>
  </g>
</svg>
