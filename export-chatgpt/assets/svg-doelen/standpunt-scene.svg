<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Standpunt: links, rechts, tegenover, hoger en lager">
  <title>Standpunt-scene</title>
  <desc>G3-MKU-E01: soft-3D kamer met kind A/B, bal hoger, doos lager, plant rechts.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1B2A4A" flood-opacity="0.15"/>
    </filter>
    <radialGradient id="ball" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5ECABC"/><stop offset="100%" stop-color="#21867A"/>
    </radialGradient>
  </defs>
  <rect width="720" height="420" fill="#F7F4EF"/>
  <text x="28" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Standpunt in de kamer</text>
  <text x="28" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Wat staat links / rechts / tegenover / hoger of lager?</text>
  <ellipse cx="360" cy="350" rx="290" ry="42" fill="#EDE8DF"/>

  <!-- table -->
  <g filter="url(#s)">
    <ellipse cx="360" cy="268" rx="100" ry="22" fill="#C5BEB3"/>
    <rect x="328" y="268" width="14" height="58" rx="4" fill="#2A9D8F"/>
    <rect x="378" y="268" width="14" height="58" rx="4" fill="#2A9D8F"/>
    <ellipse cx="360" cy="258" rx="100" ry="28" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
    <ellipse cx="340" cy="248" rx="28" ry="10" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <!-- ball higher -->
  <g filter="url(#s)">
    <circle cx="360" cy="228" r="24" fill="url(#ball)"/>
    <ellipse cx="350" cy="218" rx="8" ry="5" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <!-- box left lower -->
  <g filter="url(#s)" transform="translate(130,290)">
    <rect width="78" height="52" rx="10" fill="#1B2A4A"/>
    <rect x="6" y="6" width="30" height="16" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <text x="39" y="34" text-anchor="middle" fill="#F7F4EF" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">doos</text>
  </g>
  <!-- plant right -->
  <g filter="url(#s)" transform="translate(510,255)">
    <rect x="30" y="55" width="28" height="42" rx="5" fill="#EDE8DF" stroke="#1B2A4A" stroke-width="1.5"/>
    <ellipse cx="44" cy="42" rx="36" ry="30" fill="#2A9D8F"/>
    <ellipse cx="30" cy="32" rx="12" ry="8" fill="#FFFFFF" opacity="0.28"/>
    <ellipse cx="52" cy="28" rx="10" ry="7" fill="#3CB5A6"/>
  </g>
  <!-- child A front -->
  <g filter="url(#s)" transform="translate(300,305)">
    <circle cx="50" cy="20" r="18" fill="#F7F4EF" stroke="#1B2A4A" stroke-width="2"/>
    <circle cx="44" cy="18" r="2.2" fill="#1B2A4A"/>
    <circle cx="56" cy="18" r="2.2" fill="#1B2A4A"/>
    <path d="M44 26 Q50 30 56 26" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="28" y="40" width="44" height="46" rx="12" fill="#2A9D8F"/>
    <text x="50" y="104" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">kind A</text>
  </g>
  <!-- child B opposite -->
  <g filter="url(#s)" transform="translate(300,125)">
    <rect x="28" y="40" width="44" height="40" rx="12" fill="#1B2A4A"/>
    <circle cx="50" cy="20" r="18" fill="#F7F4EF" stroke="#1B2A4A" stroke-width="2"/>
    <circle cx="44" cy="18" r="2.2" fill="#1B2A4A"/>
    <circle cx="56" cy="18" r="2.2" fill="#1B2A4A"/>
    <text x="50" y="0" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">kind B</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">
    <text x="90" y="275" fill="#21867A">← links</text>
    <text x="600" y="275" fill="#21867A">rechts →</text>
    <text x="430" y="120" fill="#1B2A4A">tegenover</text>
    <text x="400" y="205" fill="#21867A">hoger</text>
    <text x="110" y="370" fill="#5A6A86">lager (vloer)</text>
  </g>
</svg>
