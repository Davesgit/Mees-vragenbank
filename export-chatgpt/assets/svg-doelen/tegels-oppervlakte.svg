<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Oppervlakte met tegels meten">
  <title>Tegels · oppervlakte</title>
  <desc>G3-MEET-E02: oppervlakte met natuurlijke en vaste tegels. Soft-3D cream/navy/teal.</desc>
  <defs>
    <filter id="t" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="340" fill="#F7F4EF"/>
  <text x="28" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="800">Oppervlakte met tegels</text>
  <text x="28" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Hoeveel tegels passen er op het vlak?</text>

  <!-- LEFT: irregular natural tiles (hand-sized) -->
  <text x="180" y="88" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Natuurlijke maat</text>
  <g filter="url(#t)" transform="translate(60,105)">
    <rect width="240" height="160" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2.5"/>
    <!-- organic-ish rounded tiles, 3x2-ish layout filling -->
    <rect x="12" y="12" width="70" height="66" rx="14" fill="#2A9D8F"/>
    <ellipse cx="30" cy="28" rx="14" ry="8" fill="#FFFFFF" opacity="0.28"/>
    <rect x="88" y="12" width="70" height="66" rx="14" fill="#21867A"/>
    <ellipse cx="106" cy="28" rx="14" ry="8" fill="#FFFFFF" opacity="0.22"/>
    <rect x="164" y="12" width="64" height="66" rx="14" fill="#2A9D8F"/>
    <ellipse cx="180" cy="28" rx="12" ry="7" fill="#FFFFFF" opacity="0.28"/>
    <rect x="12" y="86" width="70" height="60" rx="14" fill="#1B2A4A"/>
    <rect x="20" y="94" width="24" height="12" rx="3" fill="#FFFFFF" opacity="0.18"/>
    <rect x="88" y="86" width="70" height="60" rx="14" fill="#2A9D8F"/>
    <ellipse cx="106" cy="100" rx="14" ry="8" fill="#FFFFFF" opacity="0.28"/>
    <rect x="164" y="86" width="64" height="60" rx="14" fill="#21867A"/>
    <ellipse cx="180" cy="100" rx="12" ry="7" fill="#FFFFFF" opacity="0.22"/>
  </g>
  <text x="180" y="295" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">6 handtegels</text>

  <!-- RIGHT: fixed square grid -->
  <text x="520" y="88" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">Vaste maat</text>
  <g filter="url(#t)" transform="translate(400,105)">
    <rect width="240" height="160" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2.5"/>
    <!-- 4x3 = 12 unit tiles -->
    <g>
      <!-- row 1 -->
      <rect x="16" y="16" width="50" height="40" rx="6" fill="#2A9D8F"/>
      <rect x="70" y="16" width="50" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
      <rect x="124" y="16" width="50" height="40" rx="6" fill="#2A9D8F"/>
      <rect x="178" y="16" width="46" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
      <!-- row 2 -->
      <rect x="16" y="60" width="50" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
      <rect x="70" y="60" width="50" height="40" rx="6" fill="#2A9D8F"/>
      <rect x="124" y="60" width="50" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
      <rect x="178" y="60" width="46" height="40" rx="6" fill="#2A9D8F"/>
      <!-- row 3 -->
      <rect x="16" y="104" width="50" height="40" rx="6" fill="#2A9D8F"/>
      <rect x="70" y="104" width="50" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
      <rect x="124" y="104" width="50" height="40" rx="6" fill="#2A9D8F"/>
      <rect x="178" y="104" width="46" height="40" rx="6" fill="#E6F5F3" stroke="#21867A" stroke-width="1.5"/>
    </g>
  </g>
  <text x="520" y="295" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">4 × 3 = 12 tegels</text>

  <text x="28" y="325" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Zelfde vlak · verschillende tegels → andere telling; vaste maat maakt vergelijken eerlijk.</text>
</svg>
