<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Uitslagen van kubus en balk">
  <title>Uitslagen · eenvoudige netten</title>
  <desc>G3-MKU-E04: soft-3D uitslagen (netten) van kubus en balk om figuren te vergelijken. Cream/navy/teal.</desc>
  <defs>
    <filter id="u" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1B2A4A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="380" fill="#F7F4EF"/>
  <text x="28" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="800">Uitslagen vergelijken</text>
  <text x="28" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Welke uitslag hoort bij de kubus? Welke bij de balk?</text>

  <!-- 3D cube preview -->
  <g filter="url(#u)" transform="translate(60,90)">
    <polygon points="40,20 90,45 90,105 40,80" fill="#2A9D8F"/>
    <polygon points="40,20 10,45 10,105 40,80" fill="#1B2A4A"/>
    <polygon points="10,45 40,20 90,45 60,70" fill="#21867A"/>
    <ellipse cx="55" cy="38" rx="12" ry="6" fill="#FFFFFF" opacity="0.2"/>
    <text x="50" y="140" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">kubus</text>
  </g>

  <!-- cube net (cross) -->
  <g filter="url(#u)" transform="translate(200,80)">
    <g stroke="#1B2A4A" stroke-width="2">
      <rect x="48" y="0" width="44" height="44" rx="4" fill="#E6F5F3"/>
      <rect x="4" y="44" width="44" height="44" rx="4" fill="#FFFFFF"/>
      <rect x="48" y="44" width="44" height="44" rx="4" fill="#2A9D8F"/>
      <rect x="92" y="44" width="44" height="44" rx="4" fill="#FFFFFF"/>
      <rect x="136" y="44" width="44" height="44" rx="4" fill="#EDE8DF"/>
      <rect x="48" y="88" width="44" height="44" rx="4" fill="#FFFFFF"/>
    </g>
    <text x="90" y="160" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">uitslag kubus</text>
  </g>

  <!-- 3D box preview -->
  <g filter="url(#u)" transform="translate(440,95)">
    <polygon points="20,30 100,30 120,10 40,10" fill="#21867A"/>
    <polygon points="20,30 20,80 100,80 100,30" fill="#2A9D8F"/>
    <polygon points="100,30 120,10 120,60 100,80" fill="#1B2A4A"/>
    <rect x="28" y="38" width="30" height="12" rx="2" fill="#FFFFFF" opacity="0.22"/>
    <text x="70" y="115" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">balk</text>
  </g>

  <!-- box net -->
  <g filter="url(#u)" transform="translate(560,70)">
    <g stroke="#1B2A4A" stroke-width="2">
      <rect x="36" y="0" width="56" height="36" rx="4" fill="#E6F5F3"/>
      <rect x="0" y="36" width="36" height="56" rx="4" fill="#FFFFFF"/>
      <rect x="36" y="36" width="56" height="56" rx="4" fill="#2A9D8F"/>
      <rect x="92" y="36" width="36" height="56" rx="4" fill="#FFFFFF"/>
      <rect x="36" y="92" width="56" height="36" rx="4" fill="#EDE8DF"/>
      <rect x="36" y="128" width="56" height="36" rx="4" fill="#FFFFFF"/>
    </g>
    <text x="64" y="190" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">uitslag balk</text>
  </g>

  <text x="28" y="350" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Tip: tel de vlakken — kubus 6 gelijke vierkanten; balk heeft rechthoeken.</text>
</svg>
