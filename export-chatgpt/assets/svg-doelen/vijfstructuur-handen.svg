<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Vijfstructuur met handen: 5 en 10 vingers">
  <title>Vijfstructuur · handen</title>
  <desc>G3-GET-M02 optioneel: soft-3D handen tonen vijfstructuur (1 hand = 5, 2 handen = 10). Cream/navy/teal, naast vijfstructuur-dots.svg.</desc>
  <defs>
    <filter id="h" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1B2A4A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#F7F4EF"/>
  <text x="28" y="34" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="800">Vijfstructuur · handen</text>
  <text x="28" y="54" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="13">1 hand = 5 · 2 handen = 10 (groepjes overzien)</text>

  <!-- Hand 5 (left) - simplified soft palm + 5 fingers -->
  <g filter="url(#h)" transform="translate(80,80)">
    <ellipse cx="90" cy="130" rx="55" ry="48" fill="#F7F4EF" stroke="#1B2A4A" stroke-width="2.5"/>
    <!-- fingers as rounded rects -->
    <rect x="30" y="40" width="18" height="70" rx="9" fill="#2A9D8F"/>
    <rect x="56" y="28" width="18" height="80" rx="9" fill="#2A9D8F"/>
    <rect x="82" y="20" width="18" height="88" rx="9" fill="#2A9D8F"/>
    <rect x="108" y="28" width="18" height="80" rx="9" fill="#2A9D8F"/>
    <rect x="134" y="48" width="18" height="62" rx="9" fill="#2A9D8F"/>
    <!-- highlights -->
    <ellipse cx="41" cy="55" rx="4" ry="10" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="67" cy="45" rx="4" ry="12" fill="#FFFFFF" opacity="0.3"/>
    <ellipse cx="93" cy="38" rx="4" ry="14" fill="#FFFFFF" opacity="0.3"/>
    <text x="90" y="210" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="800">5</text>
  </g>

  <!-- plus -->
  <text x="340" y="175" text-anchor="middle" fill="#5A6A86" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="800">+</text>

  <!-- Hand 5 (right) mirrored-ish -->
  <g filter="url(#h)" transform="translate(400,80)">
    <ellipse cx="90" cy="130" rx="55" ry="48" fill="#F7F4EF" stroke="#1B2A4A" stroke-width="2.5"/>
    <rect x="30" y="48" width="18" height="62" rx="9" fill="#1B2A4A"/>
    <rect x="56" y="28" width="18" height="80" rx="9" fill="#1B2A4A"/>
    <rect x="82" y="20" width="18" height="88" rx="9" fill="#1B2A4A"/>
    <rect x="108" y="28" width="18" height="80" rx="9" fill="#1B2A4A"/>
    <rect x="134" y="40" width="18" height="70" rx="9" fill="#1B2A4A"/>
    <ellipse cx="41" cy="62" rx="4" ry="10" fill="#FFFFFF" opacity="0.2"/>
    <ellipse cx="67" cy="45" rx="4" ry="12" fill="#FFFFFF" opacity="0.2"/>
    <ellipse cx="93" cy="38" rx="4" ry="14" fill="#FFFFFF" opacity="0.2"/>
    <text x="90" y="210" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="800">5</text>
  </g>

  <!-- equals 10 -->
  <g transform="translate(620,140)">
    <circle cx="40" cy="30" r="36" fill="#E6F5F3" stroke="#2A9D8F" stroke-width="3"/>
    <text x="40" y="38" text-anchor="middle" fill="#1B2A4A" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="800">10</text>
  </g>
</svg>
